<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vida+ Sistema de Triagem</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Outfit', sans-serif; background: linear-gradient(135deg, #f0f9f5 0%, #e6f4ed 50%, #d1ebe0 100%); min-height:100vh; }
  .font-display { font-family: 'Fraunces', serif; }
  .hidden { display:none; }
  .fila-item:hover { background:#1a2b50; cursor:pointer; }
</style>
</head>
<body class="text-slate-800">

<!-- ================= PÁGINA INICIAL ================= -->
<section id="page-home" class="p-6 md:p-12">
  <nav class="flex justify-between items-center px-6 py-4 md:px-12">
    <div class="flex items-center gap-3">
      <div class="bg-emerald-500 p-2 rounded-lg text-white">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
        </svg>
      </div>
      <div>
        <span class="font-bold text-xl block leading-tight text-emerald-900">Vida+</span>
        <span class="text-xs text-emerald-700/60 font-medium">Cuidando de você com carinho</span>
      </div>
    </div>
    <button type="button" onclick="goToPage('page-login')" class="bg-blue-100 text-blue-800 px-5 py-2 rounded-xl flex items-center gap-2 hover:bg-blue-200 transition font-semibold">
      Acesso Médico
    </button>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-12 md:py-24 grid md:grid-cols-2 gap-16 items-center">
    <div>
      <h1 class="font-display text-5xl md:text-6xl text-slate-800 leading-tight mb-6">Seu cuidado começa aqui.</h1>
      <p class="text-slate-500 text-lg mb-10 max-w-md">Faça seu cadastro, conte o que está sentindo e acompanhe sua posição na fila em tempo real.</p>
      <button type="button" onclick="goToPage('page-cadastro')" class="bg-[#0d7a4a] text-white px-8 py-4 rounded-xl font-bold flex items-center gap-3 hover:bg-[#0a5f3a] transition-all shadow-lg">
        Iniciar atendimento
      </button>
    </div>
  </main>
</section>

<!-- ================= CADASTRO DO PACIENTE ================= -->
<section id="page-cadastro" class="hidden p-6 md:p-12">
  <div class="max-w-3xl mx-auto">
    <button type="button" onclick="goToPage('page-home')" class="flex items-center text-emerald-800 font-medium mb-8 hover:opacity-70">← Voltar</button>
    <h1 class="font-display text-4xl text-slate-800 mb-4">Cadastro do paciente</h1>
    <div class="bg-white rounded-3xl p-8 shadow-xl space-y-4">
      <input type="text" id="nome-paciente" placeholder="Nome completo" class="w-full px-4 py-3 border rounded-xl">
      <input type="date" id="nascimento-paciente" class="w-full px-4 py-3 border rounded-xl">
      <input type="tel" id="telefone-paciente" placeholder="Telefone" class="w-full px-4 py-3 border rounded-xl">
      <button type="button" onclick="goToPage('page-triagem')" class="w-full bg-emerald-800 text-white py-3 rounded-xl font-bold">Continuar para triagem</button>
    </div>
  </div>
</section>

<!-- ================= FORMULÁRIO MÉDICO / TRIAGEM ================= -->
<section id="page-triagem" class="hidden p-6 md:p-12">
  <div class="max-w-3xl mx-auto">
    <button type="button" onclick="goToPage('page-cadastro')" class="flex items-center text-emerald-800 font-medium mb-8 hover:opacity-70">← Voltar</button>
    <h1 class="font-display text-3xl mb-4">Formulário médico</h1>
    <div class="bg-white rounded-3xl p-8 shadow-xl space-y-4">
      <textarea id="sintomas" placeholder="Descreva seus sintomas..." class="w-full px-4 py-3 border rounded-xl"></textarea>
      <select id="tempo-sintomas" class="w-full px-4 py-3 border rounded-xl">
        <option value="">Há quanto tempo?</option>
        <option>Menos de 1 hora</option>
        <option>Algumas horas</option>
        <option>1 a 2 dias</option>
        <option>Mais de 3 dias</option>
        <option>Mais de uma semana</option>
      </select>
      <div class="grid grid-cols-4 gap-2">
        <button type="button" onclick="selecionarIntensidade('Leve')" class="p-2 border rounded-xl">Leve</button>
        <button type="button" onclick="selecionarIntensidade('Moderada')" class="p-2 border rounded-xl">Moderada</button>
        <button type="button" onclick="selecionarIntensidade('Forte')" class="p-2 border rounded-xl">Forte</button>
        <button type="button" onclick="selecionarIntensidade('Intensa')" class="p-2 border rounded-xl">Intensa</button>
      </div>
      <input type="text" id="alergias" placeholder="Alergia ou condição pré-existente" class="w-full px-4 py-3 border rounded-xl">
      <button type="button" onclick="entrarNaFila()" class="w-full bg-emerald-800 text-white py-3 rounded-xl font-bold">Entrar na fila</button>
    </div>
  </div>
</section>

<!-- ================= FILA DE ATENDIMENTO ================= -->
<section id="page-fila" class="hidden p-6 md:p-12 max-w-3xl mx-auto">
  <h1 class="text-3xl font-display mb-4">Você está na fila</h1>
  <ul id="lista-pacientes" class="space-y-2 bg-white p-4 rounded-xl shadow-xl">
    <!-- Lista preenchida via JS -->
  </ul>
  <button type="button" onclick="goToPage('page-home')" class="mt-4 px-6 py-2 border rounded-xl">Voltar para Home</button>
</section>

<!-- ================= ÁREA MÉDICA ================= -->
<section id="page-login" class="hidden flex justify-center items-center h-screen">
  <div class="bg-white text-slate-800 rounded-3xl p-8 w-full max-w-sm shadow-xl space-y-3">
    <h1 class="font-display text-2xl mb-2 text-center">Área Médica</h1>
    <label><input type="radio" name="tipo" value="login" checked onchange="toggleCadastro(false)"> Acessar como médico</label>
    <label><input type="radio" name="tipo" value="cadastro" onchange="toggleCadastro(true)"> Cadastro de novo médico</label>
    <div id="cadastro-fields" class="hidden space-y-2">
      <input type="text" id="nome-medico" placeholder="Dr(a). Nome" class="w-full px-4 py-2 border rounded-xl">
    </div>
    <input type="text" id="crm-medico" placeholder="Digite seu CRM" class="w-full px-4 py-2 border rounded-xl">
    <input type="password" id="senha-medico" placeholder="Senha" class="w-full px-4 py-2 border rounded-xl">
    <button type="button" onclick="logarMedico()" class="w-full bg-blue-600 py-2 rounded-xl text-white font-bold">Acessar / Cadastrar</button>
    <button type="button" onclick="goToPage('page-home')" class="w-full border py-2 rounded-xl text-slate-800 mt-2">Voltar</button>
  </div>
</section>

<!-- ================= DASHBOARD MÉDICO ================= -->
<section id="page-dashboard" class="hidden p-6 space-y-6 text-white">
  <div class="flex justify-between mb-4">
    <h1 class="text-xl font-bold">Painel Médico</h1>
    <button type="button" onclick="logout()" class="bg-red-600 px-4 py-1 rounded">Sair</button>
  </div>
  <ul id="lista-dashboard" class="space-y-2 bg-blue-700 p-4 rounded-xl h-96 overflow-y-auto">
    <!-- Lista preenchida via JS -->
  </ul>
</section>

<script>
let pacientes = [];

function goToPage(id){
  document.querySelectorAll('section').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function toggleCadastro(show){ document.getElementById('cadastro-fields').classList.toggle('hidden', !show); }

function selecionarIntensidade(valor){ alert("Intensidade selecionada: "+valor); }

function entrarNaFila(){
  const nome = document.getElementById('nome-paciente').value || "Paciente X";
  pacientes.push({nome: nome, intensidade:"Moderada", prioridade:"Média"});
  atualizarFila();
  goToPage('page-fila');
}

function atualizarFila(){
  const ul = document.getElementById('lista-pacientes');
  ul.innerHTML = '';
  pacientes.forEach((p,i)=>{
    const li = document.createElement('li');
    li.className="flex justify-between p-2 bg-emerald-50 rounded-xl";
    li.innerHTML=`${i+1}. ${p.nome} <span class="${p.prioridade==='Emergência'?'text-red-500':'text-yellow-500'}">${p.prioridade}</span>`;
    ul.appendChild(li);
  });
}

function logarMedico(){
  const nome = document.getElementById('nome-medico').value || "Dr(a). User";
  alert("Médico logado: "+nome);
  const dashboard = document.getElementById('lista-dashboard');
  dashboard.innerHTML='';
  pacientes.forEach((p,i)=>{
    const li=document.createElement('li');
    li.className="flex justify-between p-2 border rounded-xl";
    li.innerHTML=`${i+1}. ${p.nome} - ${p.intensidade} (${p.prioridade})`;
    dashboard.appendChild(li);
  });
  goToPage('page-dashboard');
}

function logout(){ goToPage('page-login'); }
</script>
</body>
</html>
